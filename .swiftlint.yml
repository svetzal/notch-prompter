included:
  - Sources
  - Tests
  - Apps
  - Package.swift
excluded:
  - .build
  - DerivedData
  - NotchPrompter.xcodeproj

opt_in_rules:
  - closure_spacing
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - modifier_order
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces

line_length:
  warning: 130
  error: 160
  ignores_comments: true
  ignores_urls: true

identifier_name:
  excluded: [id, x, y, dt]

type_body_length:
  warning: 300
  error: 450

file_length:
  warning: 500
  error: 800

# Swift Testing suites read best as one struct per behaviour group, and
# parameterized arguments make for long tuples.
large_tuple:
  warning: 3
  error: 4
